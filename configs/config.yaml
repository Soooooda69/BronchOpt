device: 'cuda:0'
project: 'bronchOpt'
seed: 69
data_root: './processed/bronch_real_aero1'   # one sequence folder, or 'all'
dataset_root: './processed'                  # with data_root='all': every bronch_real_aero* folder here
output: 'output'

# Renderer camera (200x200). These are the values the renderer is configured with; the OpenCV
# intrinsics of the rendered images are fx=110.21, fy=110.31, cx=100.08, cy=95.81
# (see depth_renderer.DepthRenderer and metrics.RENDER_INTRINSICS_200).
cam:
  W: 200
  H: 200
  intrinsics:
    fx: 110.21
    fy: 110.31
    cx: 100.58
    cy: 103.69
  znear: 0.00001
  zfar: 0.1

model:
  input_dim:      # model input size; images and depth maps are resized to this
    h: 224
    w: 224

eval:
  levels: [1, 2, 3]   # difficulty levels in eval_src.json (easy, medium, hard)
  start_idx: 0        # slice of the pairs within each level
  end_idx: -1         # -1 = to the end
  subsample: 1
